# Alembic environment for the superset_ownership module.
#
# A fully independent chain, NOT a branch of Superset's: its own
# script_location, its own version table (env.py), and a root revision with
# down_revision=None. `superset db upgrade` never sees it. It is run by the
# module's own command after Superset's upgrade, as the SOW specifies.
[alembic]
script_location = %(here)s
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url is injected programmatically by migrate.py from Superset's
# config; deliberately absent here so no DSN is ever committed.
#
# No [loggers]/[handlers]/[formatters] sections: env.py never calls
# logging.config.fileConfig, because every run is in-process under the
# application's own logging configuration (see env.py).
