# PCS-10243 demo stack. Project name is ALWAYS pcssetup:
#   docker compose -p pcssetup -f docker-compose.pcs-setup.yml up -d
#
# Ports (all offset from PCS/OpenFGA defaults so this never collides with
# another stack on the same host): superset 8097, openfga 8199/8183.
# Nothing here touches ports 3000, 8098, or any DB/compose-project this
# branch was told to leave alone.
#
# Mounts ONLY the single config file at the image's PYTHONPATH -- never a
# whole pythonpath directory (the pcs-ivanti spike's shadowing trap: a
# directory mount over /app/pythonpath would hide the config shim the image
# drops there; the module itself is the superset-ownership wheel in the
# image's venv, which a stray pythonpath copy would shadow).
name: pcssetup

services:
  postgres:
    networks: [default, pcsfga]
    image: postgres:17
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - pcssetup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - pcssetup-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # OpenFGA is NOT part of this stack any more: it runs as its own compose
  # project (openfga/docker-compose.openfga.yml, project pcsfga, own
  # Postgres + volume) so `down -v` here never deletes a store. Services
  # below join the external `pcsfga` network, where it answers as
  # http://openfga:8080 -- the same URL as before. Start it with
  # openfga/up.sh (setup.sh and scratch/seed-multitenant.sh do).

  superset:
    networks: [default, pcsfga]
    image: "pcs-ownership:${PCS_OWNERSHIP_TAG:-dev}"
    command: ["app"]
    restart: on-failure:5
    environment:
      SUPERSET_SECRET_KEY: "pcs-setup-demo-not-for-production"
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config_docker.py
      OWNERSHIP_ENABLED: "true"
      OPENFGA_API_URL: http://openfga:8080
      # OPENFGA_STORE_ID is written by the `seed` job below (creates the
      # store at first boot) and read here via the config file's
      # os.environ.get("OPENFGA_STORE_ID", ...) -- set after `seed` runs,
      # then this service is restarted (see README's demo walkthrough).
      OPENFGA_STORE_ID: "${OPENFGA_STORE_ID:-}"
      OPENFGA_MODEL_ID: "${OPENFGA_MODEL_ID:-}"
    ports:
      - "8097:8088"
    volumes:
      - ./docker/demo-superset-config-docker.py:/app/pythonpath/superset_config_docker.py:ro
      - ./overlay/config/superset_config_docker.example.py:/app/pythonpath/superset_config_docker.example.py:ro
      - pcssetup-uploads:/app/superset_home/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  worker:
    networks: [default, pcsfga]
    image: "pcs-ownership:${PCS_OWNERSHIP_TAG:-dev}"
    command: ["worker"]
    restart: on-failure:5
    # The image's HEALTHCHECK (inherited from the stock python-common stage)
    # probes the web port; a Celery worker serves none, so it would sit
    # forever "unhealthy" for a reason that has nothing to do with the
    # worker actually being fine. Disabled here rather than removed from
    # the image, since the superset/init services still want it.
    healthcheck:
      test: ["NONE"]
    environment:
      SUPERSET_SECRET_KEY: "pcs-setup-demo-not-for-production"
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config_docker.py
      OWNERSHIP_ENABLED: "true"
      OWNERSHIP_OUTBOX_CELERY: "true"
      OWNERSHIP_WORKER_BEAT: "true"
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: "${OPENFGA_STORE_ID:-}"
      OPENFGA_MODEL_ID: "${OPENFGA_MODEL_ID:-}"
    volumes:
      - ./docker/demo-superset-config-docker.py:/app/pythonpath/superset_config_docker.py:ro
      - ./overlay/config/superset_config_docker.example.py:/app/pythonpath/superset_config_docker.example.py:ro
    depends_on:
      superset:
        condition: service_healthy

  init:
    networks: [default, pcsfga]
    image: "pcs-ownership:${PCS_OWNERSHIP_TAG:-dev}"
    command: ["init"]
    environment:
      SUPERSET_SECRET_KEY: "pcs-setup-demo-not-for-production"
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config_docker.py
      OWNERSHIP_ENABLED: "true"
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: "${OPENFGA_STORE_ID:-}"
      OPENFGA_MODEL_ID: "${OPENFGA_MODEL_ID:-}"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_EMAIL: admin@pcs-setup.demo
    volumes:
      - ./docker/demo-superset-config-docker.py:/app/pythonpath/superset_config_docker.py:ro
      - ./overlay/config/superset_config_docker.example.py:/app/pythonpath/superset_config_docker.example.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["init"]

  seed:
    networks: [default, pcsfga]
    image: "pcs-ownership:${PCS_OWNERSHIP_TAG:-dev}"
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    environment:
      OPENFGA_API_URL: http://openfga:8080
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config_docker.py
      OWNERSHIP_ENABLED: "true"
      SUPERSET_SECRET_KEY: "pcs-setup-demo-not-for-production"
    volumes:
      - ./docker/seed.sh:/seed/seed.sh:ro
      - ./docker/demo-superset-config-docker.py:/app/pythonpath/superset_config_docker.py:ro
      - ./overlay/config/superset_config_docker.example.py:/app/pythonpath/superset_config_docker.example.py:ro
      - ./.seed-out:/seed-out
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["seed"]

volumes:
  pcssetup-postgres:
  pcssetup-redis:
  pcssetup-uploads:

networks:
  default: {}
  pcsfga:
    external: true   # created by openfga/up.sh (openfga/docker-compose.openfga.yml)
